name: iOS Fastlane Smoke

on:
  workflow_dispatch:

jobs:
  fastlane-smoke:
    name: Build + Launch via Fastlane, Capture Logs
    runs-on: macos-14
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Bundle install
        run: |
          bundle install --path vendor/bundle

      - name: Fetch Pyodide assets (fallback runtime)
        shell: bash
        run: |
          set -euo pipefail
          DEST="NotesApp/PyodideAssets"
          mkdir -p "$DEST"
          if [ -f "$DEST/pyodide.js" ]; then echo "PyodideAssets present"; exit 0; fi
          VER="0.24.1"
          URL="https://github.com/pyodide/pyodide/releases/download/${VER}/pyodide-${VER}.tar.bz2"
          TMP=$(mktemp -d)
          curl -L "$URL" -o "$TMP/pyodide.tar.bz2"
          tar -xjf "$TMP/pyodide.tar.bz2" -C "$TMP"
          rsync -a "$TMP/pyodide/" "$DEST/"

      - name: Fetch Python runtime (xcframework + stdlib)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PY_SUPPORT_REPO: beeware/Python-Apple-support
          PY_SUPPORT_TAG: 3.14-b8
          PY_TARGET_XCF_DIR: ios/Frameworks/Python.xcframework
          PY_TARGET_STDLIB: ThirdParty/Python/python-stdlib.zip
        run: bash scripts/fetch_python_runtime.sh

      - name: Run Fastlane python smoke
        env:
          FASTLANE_DISABLE_COLORS: 1
        run: |
          set -euo pipefail
          bundle exec fastlane ios python_smoke

      - name: Upload fastlane artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Fastlane-Smoke
          path: |
            fastlane_artifacts
