name: iOS Fastlane Smoke

on:
  workflow_dispatch:

jobs:
  fastlane-smoke:
    name: Build + Launch via Fastlane, Capture Logs
    runs-on: macos-14
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Bundle install
        run: |
          bundle install --path vendor/bundle

      - name: Run Fastlane python smoke
        env:
          FASTLANE_DISABLE_COLORS: 1
        run: |
          set -euo pipefail
          bundle exec fastlane ios python_smoke

      - name: Upload fastlane artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Fastlane-Smoke
          path: |
            ${{ runner.temp }}/fastlane-smoke

