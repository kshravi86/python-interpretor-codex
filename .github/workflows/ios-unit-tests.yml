name: iOS Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on:
    macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Fetch Python runtime (xcframework + stdlib)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PY_SUPPORT_REPO: beeware/Python-Apple-support
          PY_SUPPORT_TAG: 3.14-b8
          PY_TARGET_XCF_DIR: ios/Frameworks/Python.xcframework
          PY_TARGET_STDLIB: ThirdParty/Python/python-stdlib.zip
        run: bash scripts/fetch_python_runtime.sh

      - name: Run unit tests (simulator)
        run: |
          set -euo pipefail
          xcodebuild -list -project NotesApp.xcodeproj || true
          DEST="platform=iOS Simulator,name=iPhone 15"
          xcodebuild test \
            -project NotesApp.xcodeproj \
            -scheme NotesApp \
            -destination "$DEST" \
            -sdk iphonesimulator \
            -enableCodeCoverage YES
